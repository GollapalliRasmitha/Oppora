line-length = 130
target-version = "py312"
extend-exclude = ["*/migrations/*"]

[lint]
select = ["E", "F", "W", "I", "B", "UP", "DJ"]
ignore = [
  "E501",   # the formatter owns line length; long user-facing strings stay unbroken
  "DJ001",  # null on text fields is deliberate: null = "Not mentioned in email", distinct from ""
  "DJ008",  # no Django admin, so models don't need __str__
]
